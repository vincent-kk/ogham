  <body>
    <script>
      window.__DEILEN_STATE__ = "__DEILEN_STATE__";
    </script>

    <main class="shell">
      <header class="masthead">
        <div class="brand-row">
          <span class="brand" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <circle
                cx="12"
                cy="12"
                r="10"
                fill="currentColor"
                opacity="0.18"
              />
              <circle cx="12" cy="12" r="7.8" fill="currentColor" />
              <path
                d="M12 8.6c1.9 0 3 1.15 3 2.9 0 2.3-1.5 4.6-3 6.7-1.5-2.1-3-4.4-3-6.7 0-1.75 1.1-2.9 3-2.9Z"
                fill="none"
                stroke="var(--bg)"
                stroke-width="1.2"
                stroke-linejoin="round"
              />
              <path
                d="M12 13.3v3.6"
                fill="none"
                stroke="var(--bg)"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <circle cx="12" cy="12.1" r="0.95" fill="var(--bg)" />
            </svg>
          </span>
          <span class="brand-name">deilen</span>
          <span class="brand-tag">/ settings /</span>
          <div
            class="scope-crumb"
            id="config_scope"
            role="radiogroup"
            aria-label="Which layer to save the config in"
          >
            <label class="scope-option"
              ><input type="radio" name="config_scope" value="user" /><span
                >User</span
              ></label
            >
            <label class="scope-option"
              ><input type="radio" name="config_scope" value="project" /><span
                >Project</span
              ></label
            >
          </div>
        </div>
        <p class="lede">
          Theme, behavior, renderers, and size limits for the viewer.
        </p>
        <p class="scope-hint" id="scope_hint"></p>
      </header>

      <form id="form" class="form" novalidate>
        <section class="section">
          <h2 class="section-title">Appearance</h2>
          <div class="field" data-config-path="theme">
            <span class="field-label">Theme</span>
            <div class="radio-row" id="theme">
              <label class="radio"
                ><input type="radio" name="theme" value="light" /><span
                  >Light</span
                ></label
              >
              <label class="radio"
                ><input type="radio" name="theme" value="dark" /><span
                  >Dark</span
                ></label
              >
              <label class="radio"
                ><input type="radio" name="theme" value="auto" /><span
                  >Auto</span
                ></label
              >
            </div>
          </div>
          <div class="field" data-config-path="content_width_px">
            <label class="field-label" for="content_width_px"
              >Content width (px)</label
            >
            <input
              class="input"
              type="number"
              id="content_width_px"
              min="480"
              max="1600"
            />
          </div>
          <div class="field" data-config-path="font_family">
            <label class="field-label" for="font_family"
              >Body font family</label
            >
            <input
              class="input"
              type="text"
              id="font_family"
              placeholder="Default: Charter / Georgia (serif)"
            />
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Behavior</h2>
          <label class="toggle" data-config-path="auto_open">
            <input type="checkbox" id="auto_open" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label"
              >Open the browser automatically on render</span
            >
          </label>
          <div class="grid">
            <div class="field" data-config-path="collect_timeout_seconds">
              <label class="field-label" for="collect_timeout_seconds"
                >Collect timeout (s)</label
              >
              <input
                class="input"
                type="number"
                id="collect_timeout_seconds"
                min="1"
                max="600"
              />
            </div>
            <div class="field" data-config-path="idle_shutdown_minutes">
              <label class="field-label" for="idle_shutdown_minutes"
                >Idle shutdown (min)</label
              >
              <input
                class="input"
                type="number"
                id="idle_shutdown_minutes"
                min="1"
                max="120"
              />
            </div>
            <div class="field" data-config-path="session_ttl_hours">
              <label class="field-label" for="session_ttl_hours"
                >Session TTL (h)</label
              >
              <input
                class="input"
                type="number"
                id="session_ttl_hours"
                min="1"
                max="720"
              />
            </div>
            <div class="field" data-config-path="preferred_port">
              <label class="field-label" for="preferred_port"
                >Port (0 = dynamic)</label
              >
              <input
                class="input"
                type="number"
                id="preferred_port"
                min="0"
                max="65535"
              />
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Renderers</h2>
          <p class="section-help">
            Disabling a renderer skips its client-side enhancement; source stays
            readable.
          </p>
          <label class="toggle" data-config-path="renderers.highlight">
            <input type="checkbox" id="renderer_highlight" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">Syntax highlighting</span>
          </label>
          <label class="toggle" data-config-path="renderers.mermaid">
            <input type="checkbox" id="renderer_mermaid" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">Mermaid diagrams</span>
          </label>
          <label class="toggle" data-config-path="renderers.math">
            <input type="checkbox" id="renderer_math" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">Math (KaTeX)</span>
          </label>
        </section>

        <section class="section">
          <h2 class="section-title">Limits</h2>
          <div class="grid">
            <div class="field" data-config-path="max_image_mb">
              <label class="field-label" for="max_image_mb"
                >Max image (MB)</label
              >
              <input
                class="input"
                type="number"
                id="max_image_mb"
                min="1"
                max="100"
              />
            </div>
            <div class="field" data-config-path="max_payload_mb">
              <label class="field-label" for="max_payload_mb"
                >Max payload (MB)</label
              >
              <input
                class="input"
                type="number"
                id="max_payload_mb"
                min="1"
                max="200"
              />
            </div>
            <div class="field" data-config-path="max_viewer_mb">
              <label class="field-label" for="max_viewer_mb"
                >Max document (MB)</label
              >
              <input
                class="input"
                type="number"
                id="max_viewer_mb"
                min="1"
                max="50"
              />
            </div>
          </div>
        </section>
      </form>

      <div class="actions">
        <button type="button" class="btn btn-ghost" id="cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="save">Save</button>
        <button type="button" class="btn" id="save-close">
          Save &amp; Close
        </button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
