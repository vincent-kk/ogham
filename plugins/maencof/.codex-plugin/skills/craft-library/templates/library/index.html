<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library</title>
    <link rel="stylesheet" href="styles/index.css" />
    <script src="scripts/catalog.generated.js" defer></script>
    <script src="scripts/filter-catalog.js" defer></script>
    <script src="scripts/render-library.js" defer></script>
    <script src="scripts/index.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Library</h1>
        <label for="library-search">Search metadata</label>
        <input
          id="library-search"
          type="search"
          autocomplete="off"
          placeholder="Name, tag, or search term"
        />
      </header>
      <p id="library-status" role="status" aria-live="polite"></p>
      <div id="library-list"></div>
    </main>
  </body>
</html>
